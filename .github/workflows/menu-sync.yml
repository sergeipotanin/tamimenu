name: Обновление меню из Google Таблицы

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:          # и кнопка «Run workflow» вручную

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить openpyxl
        run: pip install openpyxl

      - name: Скачать таблицу из Google
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          if [ -z "$SHEET_ID" ]; then
            echo "ОШИБКА: переменная SHEET_ID не задана (Settings → Secrets and variables → Actions → Variables)"; exit 1
          fi
          if [ ! -f build_menu.py ]; then
            echo "ОШИБКА: в корне репозитория нет файла build_menu.py"; exit 1
          fi
          URL="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx"
          for i in 1 2 3; do
            CODE=$(curl -sL -A "Mozilla/5.0" -o menu.xlsx -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ] && [ "$(head -c2 menu.xlsx)" = "PK" ]; then break; fi
            echo "Попытка $i: Google ответил $CODE, файл не похож на таблицу" >&2
            rm -f menu.xlsx; sleep 15
          done
          if [ ! -f menu.xlsx ]; then
            echo "ОШИБКА: Google не отдал таблицу. Проверьте SHEET_ID и доступ «Все, у кого есть ссылка» (Читатель)."; exit 1
          fi
          ls -la menu.xlsx

      - name: Собрать menu.js
        run: |
          python3 build_menu.py menu.xlsx menu.new.js
          test "$(grep -c '"id": "dish-' menu.new.js)" -ge 1 || { echo "ОШИБКА: в таблице не нашлось ни одного блюда"; exit 1; }
          mv menu.new.js menu.js

      - name: Сохранить, если меню изменилось
        run: |
          rm -f menu.xlsx
          if ! git diff --quiet menu.js; then
            git config user.name "menu-bot"
            git config user.email "menu-bot@users.noreply.github.com"
            git add menu.js
            git commit -m "Обновление меню из Google Таблицы"
            git push
          else
            echo "Меню не изменилось"
          fi
