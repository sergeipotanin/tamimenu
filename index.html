<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5abf86">
<title>Тами — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--milk:#F5F0E4;--card:#ECE5D4;--ink:#393637;--teal:#19656d;--mid:#3b907c;--green:#5abf86;--soft:#8a8479}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--milk);color:var(--ink);max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{background:var(--milk);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
/* hero */
.wrap{height:calc(100svh + 70svh)}
.hero{position:sticky;top:0;height:100svh;min-height:520px;overflow:hidden;border-radius:0 0 28px 28px;background:#3b907c url(imageshero/bg.webp) center/cover}
.hero .logo{position:absolute;top:max(6svh,28px);left:50%;width:56%;aspect-ratio:1000/433;margin-left:-28%;-webkit-mask-image:url(images/logo-tagline.png);mask-image:url(images/logo-tagline.png)}
.stage{position:absolute;left:2%;width:96%;aspect-ratio:2209/897;top:46%}
.stage img{position:absolute;display:block;pointer-events:none;will-change:transform}
.stage .b{left:0;top:0;width:100%}
.stage .ing{transform:translate(-50%,-50%)}
.stage .sh{position:absolute;left:6%;right:6%;bottom:-4%;height:14%;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);filter:blur(6px)}
.hint{position:absolute;bottom:max(5svh,24px);left:50%;transform:translateX(-50%);color:var(--milk);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:10px 18px}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--milk);display:flex;align-items:center;height:56px;border-bottom:1px solid rgba(57,54,55,.1)}
.nav .s{flex:none;width:56px;height:100%;display:grid;place-items:center;border-right:1px solid rgba(57,54,55,.15)}
.nav svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;height:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:0 16px;font-size:14px;font-weight:400;color:var(--soft);white-space:nowrap;position:relative;transition:color .2s}
.tabs button.on{color:var(--teal);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--teal)}
.sbox{display:none;flex:1;padding:0 8px 0 14px}
.sbox input{width:100%;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:0}
.nav.q .tabs{display:none}.nav.q .sbox{display:block}
/* menu */
section{padding:28px 16px 4px}
h2{font-size:22px;font-weight:600;color:var(--teal);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px}
.card{display:flex;flex-direction:column;text-align:left;background:#FBF8F2;border-radius:22px;padding:8px 8px 12px;box-shadow:0 2px 10px rgba(57,54,55,.07)}
.card .ph{position:relative;aspect-ratio:1;border-radius:16px;background:var(--card);overflow:hidden;width:100%}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.card .n{margin:10px 4px 0;font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{margin:auto 4px 0;padding-top:8px;display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}
.card .m b{color:var(--ink);font-weight:600}
.w{white-space:nowrap}
.bd{position:absolute;top:8px;left:8px;display:flex;gap:5px}
.bd i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em;padding:4px 8px;border-radius:20px;background:var(--milk);color:#D63A2B}
.bd i.new{background:#D63A2B;color:#fff}
.bd i.spicy{width:24px;height:24px;padding:0;display:grid;place-items:center;background:#D63A2B}
.bd i.spicy svg{width:14px;height:14px}
.none{padding:40px 16px;text-align:center;color:var(--soft);display:none}
/* footer */
footer{margin-top:44px;padding:36px 24px calc(36px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#3b907c,#19656d);color:var(--milk);border-radius:28px 28px 0 0;text-align:center;font-size:13px;line-height:1.7}
footer .logo{width:44%;aspect-ratio:2454/755;margin:0 auto 18px;-webkit-mask-image:url(images/logo.png);mask-image:url(images/logo.png)}
footer a{color:var(--milk)}footer p{opacity:.9}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:var(--milk);overflow-y:auto;overscroll-behavior:contain;display:none;max-width:560px;margin:0 auto}
#sheet.open{display:block}
#sheet .top{position:relative;padding:max(10px,env(safe-area-inset-top)) 0 0}
#sheet .top img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
#sheet .grab{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 4px);left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(255,255,255,.7)}
#sheet .x{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 14px);right:14px;width:36px;height:36px;border-radius:50%;background:rgba(245,240,228,.9);font-size:18px;line-height:36px;color:var(--ink)}
#sheet .body{padding:20px 20px calc(36px + env(safe-area-inset-bottom))}
#sheet h1{font-size:24px;font-weight:700;line-height:1.2;color:var(--teal)}
.vs{display:flex;gap:8px;margin:18px 0 4px;overflow-x:auto}
.vs button{flex:1;min-width:92px;padding:10px 8px;border-radius:14px;border:1.5px solid rgba(25,101,109,.3);font-size:13px;font-weight:500;line-height:1.3}
.vs button small{display:block;font-size:12px;color:var(--soft);font-weight:400}
.vs button.on{background:var(--teal);border-color:var(--teal);color:var(--milk)}.vs button.on small{color:var(--milk);opacity:.85}
.info{display:flex;align-items:baseline;gap:16px;margin:18px 0;font-size:14px;color:var(--soft)}
.info .p{font-size:28px;font-weight:700;color:var(--ink);margin-right:auto}
.desc{font-size:15px;line-height:1.55;font-weight:400}
</style>
</head>
<body>
<div class="wrap" id="wrap"><header class="hero" id="hero">
  <div class="mono logo"></div>
  <div class="stage" id="stage"><div class="sh"></div><img class="b" src="imageshero/bowl-bottom.webp" alt=""><img class="ing" src="imageshero/nori.webp" alt="" style="left:26.59%;top:3.82%;width:33.39%" data-up="0.55" data-dx="-0.12" data-rot="-14"><img class="ing" src="imageshero/carrot.webp" alt="" style="left:50.47%;top:13.86%;width:21.74%" data-up="0.72" data-dx="0.06" data-rot="12"><img class="ing" src="imageshero/meat.webp" alt="" style="left:80.94%;top:25.81%;width:22.13%" data-up="0.62" data-dx="0.16" data-rot="-10"><img class="ing" src="imageshero/onion.webp" alt="" style="left:48.52%;top:32.98%;width:26.79%" data-up="0.6" data-dx="0.02" data-rot="20"><img class="ing" src="imageshero/tofu.webp" alt="" style="left:59.39%;top:43.5%;width:16.3%" data-up="0.35" data-dx="0.1" data-rot="-18"><img class="ing" src="imageshero/noodle.webp" alt="" style="left:65.99%;top:38.72%;width:20.57%" data-up="0.5" data-dx="0.14" data-rot="10"><img class="ing" src="imageshero/egg.webp" alt="" style="left:26.79%;top:35.85%;width:24.26%" data-up="0.42" data-dx="-0.06" data-rot="8"><img class="b" src="imageshero/bowl-top.webp" alt=""></div>
  <button class="hint" id="hint">меню ↓</button>
</header></div>
<nav class="nav" id="nav">
  <button class="s" id="sbtn" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
  <div class="tabs" id="tabs"></div>
  <div class="sbox"><input id="q" type="search" placeholder="Поиск по меню" autocomplete="off"></div>
</nav>
<main id="menu"></main>
<div class="none" id="none">Ничего не нашлось</div>
<footer>
  <div class="mono logo"></div>
  <p>Воронеж</p>
  <p>ул. Фридриха Энгельса · парк «Дельфин»<br>парк «Орленок» · Сити-парк «Град»</p>
  <p style="margin-top:10px"><a href="https://instagram.com/tami.vrn" target="_blank" rel="noopener">@tami.vrn</a></p>
</footer>
<div id="sheet" role="dialog" aria-modal="true"></div>
<script src="menu.js"></script>
<script>
(function(){
var M=window.MENU,$=function(s){return document.querySelector(s)};
var BADGE={hit:"ТОП",new:"NEW",spicy:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M16 2.5c1.2 0 2.2.6 2.8 1.6-1.2.1-2.2.7-2.8 1.7 1.7 3.4 1 8.4-3.6 12.6-2.6 2.4-5.6 2.8-7.9 2.2 2.3-1 4.1-2.9 5.3-5.9C9.3 10 10.8 7.6 12.1 5.1c.6-1.3 1.8-2.6 3.9-2.6z"/></svg>'};
var fmt=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0")};
function words(t){return t.split(" ").map(function(w){return'<span class="w">'+w+"</span>"}).join(" ")}
function range(d,k){var v=d.variants.map(function(x){return x[k]}),a=Math.min.apply(0,v),b=Math.max.apply(0,v);return a===b?[a,false]:[a,true]}
function price(d){var r=range(d,"p");return(r[1]?"от ":"")+fmt(r[0])+"\u00A0₽"}
function weight(d){var v=d.variants.map(function(x){return x.w}),a=Math.min.apply(0,v),b=Math.max.apply(0,v);return(a===b?a:a+"–"+b)+"\u00A0г"}
function badges(d){return d.badges&&d.badges.length?'<div class="bd">'+d.badges.map(function(b){return'<i class="'+b+'">'+BADGE[b]+'</i>'}).join("")+'</div>':""}
/* build */
var tabs=$("#tabs"),menu=$("#menu"),secs=[];
M.categories.forEach(function(c){
  var b=document.createElement("button");b.textContent=c.name;b.dataset.id=c.id;tabs.appendChild(b);
  var s=document.createElement("section");s.id=c.id;
  s.innerHTML="<h2>"+c.name+'</h2><div class="grid"></div>';
  var g=s.querySelector(".grid");
  M.dishes.filter(function(d){return d.cat===c.id}).forEach(function(d){
    var a=document.createElement("button");a.className="card";a.dataset.id=d.id;a.dataset.s=(d.name+" "+(d.desc||"")).toLowerCase();
    a.innerHTML='<div class="ph"><img loading="lazy" alt="" src="images/'+d.img+'.webp">'+badges(d)+'</div><div class="n">'+words(d.name)+'</div><div class="m"><span>'+weight(d)+'</span><b>'+price(d)+"</b></div>";
    g.appendChild(a)});
  menu.appendChild(s);secs.push({el:s,btn:b});
});
/* scroll: parallax + active tab */
var nav=$("#nav"),tick=false,cur=null,stage=$("#stage"),ings=[].slice.call(document.querySelectorAll(".ing"));
function onScroll(){
  var y=window.scrollY,vh=window.innerHeight,p=Math.min(1,Math.max(0,y/(vh*.7))),e=1-(1-p)*(1-p),sw=stage.offsetWidth;
  if(y<vh*2)ings.forEach(function(el){var a=el.dataset;el.style.transform="translate(-50%,-50%) translate3d("+(a.dx*sw*e)+"px,"+(-a.up*vh*e)+"px,0) rotate("+(a.rot*e)+"deg)";el.style.opacity=1-Math.max(0,(p-.5)/.5)});
  var act=null,navH=nav.offsetHeight;
  secs.forEach(function(s){if(s.el.style.display!=="none"&&s.el.getBoundingClientRect().top<=navH+40)act=s});
  if(act!==cur){cur=act;secs.forEach(function(s){s.btn.classList.toggle("on",s===act)});
    if(act){var t=act.btn;tabs.scrollTo({left:t.offsetLeft-tabs.clientWidth/2+t.clientWidth/2,behavior:"smooth"})}}
  tick=false}
window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});onScroll();
tabs.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  var el=document.getElementById(b.dataset.id);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-nav.offsetHeight+1,behavior:"smooth"})});
$("#hint").addEventListener("click",function(){window.scrollTo({top:menu.getBoundingClientRect().top+window.scrollY-nav.offsetHeight,behavior:"smooth"})});
/* search */
var q=$("#q");
$("#sbtn").addEventListener("click",function(){var on=nav.classList.toggle("q");if(on)q.focus();else{q.value="";filter("")}});
q.addEventListener("input",function(){filter(q.value.trim().toLowerCase())});
function filter(v){var any=false;
  secs.forEach(function(s){var n=0;s.el.querySelectorAll(".card").forEach(function(c){var ok=!v||c.dataset.s.indexOf(v)>-1;c.style.display=ok?"":"none";if(ok)n++});
    s.el.style.display=n?"":"none";s.btn.style.display=n?"":"none";if(n)any=true});
  $("#none").style.display=any?"none":"block";onScroll()}
/* sheet */
var sheet=$("#sheet"),dishes={};M.dishes.forEach(function(d){dishes[d.id]=d});
function show(d){
  var vi=0,L=d.variants.length>1;
  function draw(){var v=d.variants[vi];
    sheet.querySelector(".info").innerHTML='<span class="p">'+fmt(v.p)+'\u00A0₽</span><span>'+v.w+'\u00A0г</span><span>'+((v.kcal||d.kcal)?(v.kcal||d.kcal):"—")+'\u00A0ккал</span>';
    sheet.querySelectorAll(".vs button").forEach(function(b,i){b.classList.toggle("on",i===vi)})}
  sheet.innerHTML='<div class="top"><img alt="" src="images/'+d.img+'-l.webp"><div class="grab"></div><button class="x" aria-label="Закрыть">✕</button></div><div class="body"><h1>'+words(d.name)+"</h1>"+
    (L?'<div class="vs">'+d.variants.map(function(v){return"<button>"+v.label+"<small>"+fmt(v.p)+"\u00A0₽</small></button>"}).join("")+"</div>":"")+
    '<div class="info"></div><p class="desc">'+(d.desc||"")+"</p></div>";
  sheet.querySelectorAll(".vs button").forEach(function(b,i){b.onclick=function(){vi=i;draw()}});
  sheet.querySelector(".x").onclick=close;draw();
  sheet.classList.add("open");sheet.scrollTop=0;sheet.style.transform="";document.body.classList.add("lock")}
function hide(){sheet.classList.remove("open");document.body.classList.remove("lock")}
function close(){hide();if(location.hash)history.replaceState(null,"",location.pathname+location.search)}
function route(){var d=dishes[location.hash.slice(1)];if(d)show(d);else hide()}
menu.addEventListener("click",function(e){var c=e.target.closest(".card");if(c)location.hash=c.dataset.id});
window.addEventListener("hashchange",route);route();
/* swipe down to close */
var y0=null,dy=0;
sheet.addEventListener("touchstart",function(e){y0=sheet.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
sheet.addEventListener("touchmove",function(e){if(y0===null)return;dy=e.touches[0].clientY-y0;
  if(dy>0&&sheet.scrollTop<=0){e.preventDefault();sheet.style.transform="translateY("+dy+"px)"}else{sheet.style.transform=""}},{passive:false});
sheet.addEventListener("touchend",function(){if(y0!==null&&dy>110)close();sheet.style.transform="";y0=null;dy=0});
})();
</script>
</body>
</html>
